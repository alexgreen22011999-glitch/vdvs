<!DOCTYPE html>
<html lang="ru"><head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Серотониновый синапс — действие СИОЗС</title>
<style>
  :root {
    /* Norma palette (greens) */
    --g-bg: #eaf5ee;
    --g-fill: #c9e3cf;
    --g-fill-2: #b6d8be;
    --g-line: #4f8a63;
    --g-deep: #1f5d36;
    --g-ink: #134a28;

    /* SSRI palette (rose) */
    --r-bg: #fbeaee;
    --r-fill: #f1c9d2;
    --r-fill-2: #ebb6c2;
    --r-line: #b65a72;
    --r-deep: #8b2a44;
    --r-ink: #6b1e34;

    /* Depression palette (blue-grey) */
    --d-bg: #e8edf5;
    --d-fill: #b8c8e0;
    --d-fill-2: #9fb3d0;
    --d-line: #4a6a9a;
    --d-deep: #1e3d6e;
    --d-ink: #122a52;

    --paper: #f4f6f8;
    --ink: #20262d;
    --rule: #d6dde3;

    --gold: #f0b631;
    --gold-deep: #b67c14;

    --na: #2f6cd6;
    --na-light: #6e9ee8;

    --font: "PT Sans", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--font); color: var(--ink); }

  .stage {
    width: min(100vw, 1700px);
    margin: 0 auto;
    padding: 28px 24px 32px;
    box-sizing: border-box;
  }

  .figure {
    width: 100%;
    aspect-ratio: 1480 / 1130;
    display: block;
  }

  /* ------- shared label classes ------- */
  .t-title    { font: 700 30px/1 var(--font); letter-spacing: .02em; }
  .t-panel    { font: 700 22px/1.05 var(--font); letter-spacing: .02em; }
  .t-label    { font: 700 14px/1.15 var(--font); letter-spacing: .02em; }
  .t-small    { font: 600 12px/1.2 var(--font); }
  .t-mono     { font: 600 12px/1.2 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .t-legend   { font: 600 15px/1.25 var(--font); fill: #2c3540; }
  .t-mark     { font: 700 16px/1 var(--font); }

  /* ------- animations ------- */
  /* Norma: serotonin exits left vesicle (curved left arc) → appears in cleft → moves to SERT → disappears inside */
  @keyframes norma-uptake {
    0%   { transform: var(--fromVes) scale(0.5);      opacity: 0; }
    6%   { transform: var(--fromVes) scale(0.7);      opacity: 1; }
    18%  { transform: var(--midL)    scale(0.9);      opacity: 1; }
    32%  { transform: translate(0, 0) scale(1);       opacity: 1; }
    70%  { transform: translate(0, 0) scale(1);       opacity: 1; }
    78%  { transform: var(--toSertX)    scale(1);     opacity: 1; }
    88%  { transform: var(--toSertEntry) scale(0.9);  opacity: 1; }
    92%  { transform: var(--p2)          scale(0.8);  opacity: 1; }
    95%  { transform: var(--p3)          scale(0.7);  opacity: 1; }
    97%  { transform: var(--p4)          scale(0.5);  opacity: 1; }
    99%  { transform: var(--p4)          scale(0.3);  opacity: 0; }
    100% { transform: var(--p4)          scale(0.3);  opacity: 0; }
  }

  @keyframes sert-close {
    0%,  22% { transform: translateX(0); }
    27%       { transform: translateX(4px); }
    32%       { transform: translateX(2px); }
    88%       { transform: translateX(2px); }
    94%       { transform: translateX(0); }
    100%      { transform: translateX(0); }
  }
  @keyframes sert-close-r {
    0%,  22% { transform: translateX(0); }
    27%       { transform: translateX(-4px); }
    32%       { transform: translateX(-2px); }
    88%       { transform: translateX(-2px); }
    94%       { transform: translateX(0); }
    100%      { transform: translateX(0); }
  }

  /* SSRI: serotonin drifts in cleft; sertraline sits in SERT from 25%–95% of 11s cycle.
     Molecules approach SERT at 25%, bounce off sertraline, drift back; try again at 95%. */
  @keyframes ssri-drift {
    0%   { transform: translate(0, 0);                    opacity: 0; }
    5%   { transform: translate(0, 0);                    opacity: 1; }
    /* random drift phase */
    12%  { transform: var(--drift1, translate(8px,-6px));  opacity: 1; }
    20%  { transform: var(--drift2, translate(-6px,5px));  opacity: 1; }
    /* 25%: sertraline docks — molecules start moving toward SERT */
    30%  { transform: var(--toSertX);                     opacity: 1; }
    /* touch sertraline — bounce */
    35%  { transform: var(--toSertEntry);                 opacity: 1; }
    /* rebound */
    40%  { transform: var(--toSertX);                     opacity: 1; }
    /* drift away */
    48%  { transform: translate(0, 0);                    opacity: 1; }
    /* continued drift motion in cleft */
    58%  { transform: var(--drift3, translate(10px,-8px)); opacity: 1; }
    68%  { transform: var(--drift4, translate(-8px,6px));  opacity: 1; }
    78%  { transform: var(--drift5, translate(6px,-4px));  opacity: 1; }
    88%  { transform: translate(0, 0);                    opacity: 1; }
    100% { transform: translate(0, 0);                    opacity: 1; }
  }

  /* One-shot fade-in for each serotonin dot */
  @keyframes ssri-appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes sertraline-pulse {
    0%   { transform: scale(1);    filter: drop-shadow(0 0 3px  rgba(240,182,49,.15)); }
    50%  { transform: scale(1.04); filter: drop-shadow(0 0 10px rgba(240,182,49,.5));  }
    100% { transform: scale(1);    filter: drop-shadow(0 0 3px  rgba(240,182,49,.15)); }
  }

  @keyframes receptor-glow-g {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(45,138,78,0)); }
    50%      { filter: drop-shadow(0 0 5px rgba(45,138,78,.4)); }
  }

  @keyframes receptor-glow-r {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(192,64,106,0)); }
    50%      { filter: drop-shadow(0 0 10px rgba(192,64,106,.7)); }
  }

@keyframes arrow-flow-down {
    0%   { transform: translateY(-4px); opacity: .6; }
    50%  { transform: translateY(2px);  opacity: 1; }
    100% { transform: translateY(-4px); opacity: .6; }
  }
  @keyframes arrow-flow-up {
    0%   { transform: translateY(4px);  opacity: .6; }
    50%  { transform: translateY(-2px); opacity: 1; }
    100% { transform: translateY(4px);  opacity: .6; }
  }

  /* Sertraline flies from middle of right side → SERT position, then loops.
     Molecule lives inside scale(1.4) group so translate values are in scaled coords.
     Panel-SSRI local coords: SERT at (560,628), right-side midpoint ~(700,380).
     Delta in scale(1.4) space: dx≈+100, dy≈-177. */
  @keyframes sertraline-fly {
    0%   { transform: translate(100px, -177px) scale(0.75); opacity: 0; }
    4%   { transform: translate(100px, -177px) scale(0.85); opacity: 1; }
    25%  { transform: translate(0px, 0px) scale(1);         opacity: 1; filter: drop-shadow(0 0 0 rgba(240,182,49,0)); }
    35%  { transform: translate(0px, 0px) scale(1.1);       opacity: 1; filter: drop-shadow(0 0 10px rgba(240,182,49,.8)); }
    48%  { transform: translate(0px, 0px) scale(1.04);      opacity: 1; filter: drop-shadow(0 0 5px rgba(240,182,49,.5)); }
    62%  { transform: translate(0px, 0px) scale(1.08);      opacity: 1; filter: drop-shadow(0 0 8px rgba(240,182,49,.6)); }
    75%  { transform: translate(0px, 0px) scale(1.04);      opacity: 1; filter: drop-shadow(0 0 5px rgba(240,182,49,.4)); }
    86%  { transform: translate(0px, 0px) scale(1.07);      opacity: 1; filter: drop-shadow(0 0 7px rgba(240,182,49,.55)); }
    95%  { transform: translate(0px, 0px) scale(1);         opacity: 1; filter: drop-shadow(0 0 2px rgba(240,182,49,.2)); }
    100% { transform: translate(0px, 0px) scale(1);         opacity: 1; }
  }

  /* Red glow layer on SERT — fades in/out when sertraline connects (~25% of cycle) */
  @keyframes sert-glow-layer {
    0%,  22% { opacity: 0; transform: scale(1); }
    27%      { opacity: .7; transform: scale(1.1); }
    35%      { opacity: 1;  transform: scale(1.15); }
    48%      { opacity: .8; transform: scale(1.12); }
    62%      { opacity: 1;  transform: scale(1.15); }
    75%      { opacity: .7; transform: scale(1.1); }
    88%      { opacity: .3; transform: scale(1.03); }
    95%      { opacity: 0;  transform: scale(1); }
    100%     { opacity: 0;  transform: scale(1); }
  }
  /* Base fill pulse (subtle colour shift) */
  @keyframes sert-body-pulse {
    0%,  22% { fill: url(#sert-r); }
    35%      { fill: #ff0028; }
    48%      { fill: #d9001e; }
    62%      { fill: #ff0028; }
    75%      { fill: #d9001e; }
    88%      { fill: url(#sert-r); }
    100%     { fill: url(#sert-r); }
  }
  @keyframes sert-bridge-pulse {
    0%,  22% { fill: #9c4257; }
    35%      { fill: #ff0028; }
    48%      { fill: #d9001e; }
    62%      { fill: #ff0028; }
    75%      { fill: #d9001e; }
    88%      { fill: #9c4257; }
    100%     { fill: #9c4257; }
  }

  /* Block-X appears when sertraline arrives at SERT */
  @keyframes block-x-sync {
    0%,  23% { opacity: 0; transform: scale(0.3); }
    30%      { opacity: 1; transform: scale(1.25); }
    40%      { opacity: 1; transform: scale(1);    }
    88%      { opacity: 1; transform: scale(1);    }
    96%      { opacity: 0; transform: scale(0.5);  }
    100%     { opacity: 0; transform: scale(0.3);  }
  }

  @keyframes sert-drop-in {
    0%   { transform: translateY(-20px); opacity: 0; }
    30%  { transform: translateY(-20px); opacity: 0; }
    70%  { transform: translateY(0px);   opacity: 1; }
    100% { transform: translateY(0px);   opacity: 1; }
  }
  @keyframes sertraline-settle {
    0%, 100% { transform: translateY(0px) scale(1);    filter: drop-shadow(0 0 0 rgba(240,182,49,0)); }
    50%      { transform: translateY(0px) scale(1.06); filter: drop-shadow(0 0 6px rgba(240,182,49,.55)); }
  }
  @keyframes sert-blocked-outline {
    0%, 100% { opacity: .3; }
    50%      { opacity: .8; }
  }

  /* attach animations */
  .norma-sero {
    transform-origin: center;
    transform-box: fill-box;
    animation: norma-uptake 4s ease-in-out infinite;
  }
  .ssri-sero {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    animation-name: ssri-drift;
    animation-duration: 11s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-fill-mode: none;
  }
  .sertraline { transform-origin: center; transform-box: fill-box; animation: sertraline-pulse 4s ease-in-out infinite; }
  .receptor-g { transform-origin: center; transform-box: fill-box; animation: receptor-glow-g 4s ease-in-out infinite; }
  .receptor-r { transform-origin: center; transform-box: fill-box; animation: receptor-glow-r 2s ease-in-out infinite; }
.arrow-fast { transform-origin: center; transform-box: fill-box; animation: arrow-flow-down 1.6s ease-in-out infinite; }
  .arrow-up   { transform-origin: center; transform-box: fill-box; animation: arrow-flow-up   2.2s ease-in-out infinite; }
  .sert-drop-in    { transform-origin: center; transform-box: fill-box; animation: sertraline-fly 11s cubic-bezier(.4,0,.2,1) infinite; }
  .sert-blocked-outline { transform-origin: center; transform-box: fill-box; animation: block-x-sync 11s ease-in-out infinite; opacity: 0; }
  .sert-body-pulse   { transform-origin: center; transform-box: fill-box; animation: sert-body-pulse   11s ease-in-out infinite; }
  .sert-bridge-pulse { transform-origin: center; transform-box: fill-box; animation: sert-bridge-pulse 11s ease-in-out infinite; }
  .sert-glow-layer   { transform-origin: center; transform-box: fill-box; animation: sert-glow-layer   11s ease-in-out infinite; opacity: 0; }
.sert-sub-l { transform-origin: center; transform-box: fill-box; animation: sert-close   11s ease-in-out infinite; }
  .sert-sub-r { transform-origin: center; transform-box: fill-box; animation: sert-close-r 11s ease-in-out infinite; }

  /* Vesicle bobbing — gentle up/down float */
  @keyframes bob-a {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes bob-b {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-5px); }
  }

  /* Bottom vesicle exocytosis: moves down toward membrane, then fades */
  @keyframes exo-move {
    0%   { transform: translateY(0px); opacity: 1; }
    55%  { transform: translateY(0px); opacity: 1; }
    80%  { transform: translateY(30px); opacity: .8; }
    90%  { transform: translateY(45px); opacity: 0; }
    100% { transform: translateY(45px); opacity: 0; }
  }

  /* Serotonin dot bursting from exocytosis site */
  @keyframes exo-dot-l {
    0%, 55%  { transform: translate(0,0); opacity: 0; }
    60%      { transform: translate(0,0); opacity: 1; }
    90%      { transform: var(--ex-l, translate(-12px, 20px)); opacity: 1; }
    100%     { transform: var(--ex-l, translate(-12px, 20px)); opacity: 0; }
  }
  @keyframes exo-dot-c {
    0%, 55%  { transform: translate(0,0); opacity: 0; }
    62%      { transform: translate(0,0); opacity: 1; }
    90%      { transform: var(--ex-c, translate(0, 24px)); opacity: 1; }
    100%     { transform: var(--ex-c, translate(0, 24px)); opacity: 0; }
  }
  @keyframes exo-dot-r {
    0%, 55%  { transform: translate(0,0); opacity: 0; }
    64%      { transform: translate(0,0); opacity: 1; }
    90%      { transform: var(--ex-r, translate(12px, 20px)); opacity: 1; }
    100%     { transform: var(--ex-r, translate(12px, 20px)); opacity: 0; }
  }

  .ves-bob-a { transform-origin: center; transform-box: fill-box; animation: bob-a 3.2s ease-in-out infinite; }
  .ves-bob-b { transform-origin: center; transform-box: fill-box; animation: bob-b 3.8s ease-in-out infinite; }
  .ves-exo   { transform-origin: center; transform-box: fill-box; animation: exo-move 5s ease-in-out infinite; }
  .exo-dot-l { transform-origin: center; transform-box: fill-box; animation: exo-dot-l 5s ease-in-out infinite; }
  .exo-dot-c { transform-origin: center; transform-box: fill-box; animation: exo-dot-c 5s ease-in-out infinite; }
  .exo-dot-r { transform-origin: center; transform-box: fill-box; animation: exo-dot-r 5s ease-in-out infinite; }

  /* Depression: receptor dim glow (blue-grey, less active) */
  @keyframes receptor-glow-d {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(74,106,154,0)); opacity: 0.6; }
    50%      { filter: drop-shadow(0 0 4px rgba(74,106,154,.35)); opacity: 0.8; }
  }
  .receptor-d { transform-origin: center; transform-box: fill-box; animation: receptor-glow-d 5s ease-in-out infinite; }

  /* Depression serotonin — same uptake as norma but far fewer molecules, slower release */
  .dep-sero {
    transform-origin: center;
    transform-box: fill-box;
    animation: norma-uptake 5s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }

  /* Pause toggle */
  .paused * { animation-play-state: paused !important; }

  /* Pause button */
  .btn-pause {
    display: block;
    margin: 0 auto 14px;
    background: #ffffff;
    border: 1px solid #d0d5da;
    border-radius: 8px;
    padding: 8px 22px;
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: background .15s;
    color: var(--ink);
  }
  .btn-pause:hover { background: #f4f6f8; }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .t-title  { font-size: 36px; }
    .t-panel  { font-size: 26px; }
    .t-label  { font-size: 17px; }
    .t-small  { font-size: 14px; }
    .t-mono   { font-size: 14px; }
    .t-legend { font-size: 16px; }
    .t-mark   { font-size: 19px; }

    /* Legend: two-column grid inside the SVG is not possible directly,
       so we overlay a separate HTML legend on mobile */
    .legend-mobile {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;
      background: #fff;
      border: 1px solid #dde3ea;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 10px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: #2c3540;
    }
    .legend-mobile .leg-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: calc(50% - 12px);
    }
    .legend-mobile .leg-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    /* Hide SVG legend on mobile */
    #legend { display: none; }
  }
  @media (min-width: 769px) {
    .legend-mobile { display: none; }
  }
</style>

</head>
<body style="">
<div class="stage">

<button class="btn-pause" id="btnPause" onclick="(function(){var b=document.getElementById('btnPause');var paused=document.body.classList.toggle('paused');b.textContent=paused?'▶ Играть':'⏸ Пауза';})()">⏸ Пауза</button>

<svg class="figure" viewBox="0 0 1480 1130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Серотониновый синапс — норма, СИОЗС и депрессия" style="aspect-ratio: 1480/1130;">

  <defs>
    <!-- Subtle inner soft fill gradients for neurons -->
    <radialGradient id="presyn-g" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f0faf2"></stop>
      <stop offset="60%" stop-color="#c9e3cf"></stop>
      <stop offset="100%" stop-color="#a9cdb3"></stop>
    </radialGradient>
    <radialGradient id="presyn-r" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fdf0f3"></stop>
      <stop offset="60%" stop-color="#f1c9d2"></stop>
      <stop offset="100%" stop-color="#dfa6b3"></stop>
    </radialGradient>
    <radialGradient id="presyn-d" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#e8eef8"></stop>
      <stop offset="60%" stop-color="#b8c8e0"></stop>
      <stop offset="100%" stop-color="#8faac8"></stop>
    </radialGradient>

    <linearGradient id="postsyn-g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d6ead9"></stop>
      <stop offset="100%" stop-color="#b9d6bf"></stop>
    </linearGradient>
    <linearGradient id="postsyn-r" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4d2d9"></stop>
      <stop offset="100%" stop-color="#e3b1bd"></stop>
    </linearGradient>
    <linearGradient id="postsyn-d" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8d8ee"></stop>
      <stop offset="100%" stop-color="#a0bcd8"></stop>
    </linearGradient>
    <linearGradient id="sert-d" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a7aaa"></stop>
      <stop offset="100%" stop-color="#1e3d6e"></stop>
    </linearGradient>

    <!-- Vesicle gradient (white sphere with mint highlight) -->
    <radialGradient id="ves-hl" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="55%" stop-color="#f6fbf7"></stop>
      <stop offset="100%" stop-color="#e2efe4"></stop>
    </radialGradient>
    <radialGradient id="ves-hl-r" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="55%" stop-color="#fdf3f5"></stop>
      <stop offset="100%" stop-color="#f1d6dc"></stop>
    </radialGradient>

    <!-- SERT body gradient -->
    <linearGradient id="sert-g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5e9c72"></stop>
      <stop offset="100%" stop-color="#2d6a44"></stop>
    </linearGradient>
    <linearGradient id="sert-r" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c47488"></stop>
      <stop offset="100%" stop-color="#8a2e48"></stop>
    </linearGradient>

    <!-- Sertraline molecule gradient -->
    <radialGradient id="pill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe6a3"></stop>
      <stop offset="55%" stop-color="#f0b631"></stop>
      <stop offset="100%" stop-color="#b67c14"></stop>
    </radialGradient>

    <!-- Red glow filter for SERT pulse -->
    <filter id="sert-red-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"></feGaussianBlur>
      <feFlood flood-color="#ff0028" flood-opacity="1" result="color"></feFlood>
      <feComposite in="color" in2="blur" operator="in" result="glow"></feComposite>
      <feMerge><feMergeNode in="glow"></feMergeNode><feMergeNode in="glow"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <!-- Soft drop shadow for neurons -->
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"></feGaussianBlur>
      <feOffset dx="0" dy="3" result="off"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope=".22"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <!-- Arrowheads -->
    <marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5d36"></path>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
